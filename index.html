
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Plugin Architect IDE</title>
  <!-- Security Policy to allow File System Access in iframes if possible -->
  <meta http-equiv="Permissions-Policy" content="file-system=(self)">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Menlo', 'monospace'],
            vazir: ['Vazirmatn', 'sans-serif'],
          },
          screens: {
            'xs': '480px',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Vazirmatn:wght@300;400;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.2);
      border-radius: 10px;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Modern Markdown Styles with RTL support */
    .prose-rtl {
      direction: rtl;
      text-align: right;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 400;
      color: #3f3f46; /* text-zinc-700 */
    }
    .dark .prose-rtl {
      color: #e4e4e7; /* text-zinc-200 */
    }
    
    .prose-rtl h1, .prose-rtl h2, .prose-rtl h3, .prose-rtl h4 {
      font-weight: 700;
      margin-top: 2rem;
      margin-bottom: 1rem;
      color: #2563eb; /* blue-600 */
    }
    .dark .prose-rtl h1, .dark .prose-rtl h2, .dark .prose-rtl h3, .dark .prose-rtl h4 {
      color: #60a5fa; /* blue-400 */
    }
    .prose-rtl p {
      margin-bottom: 1.25rem;
      line-height: 1.8;
    }
    
    /* Code blocks */
    .prose-rtl pre {
      direction: ltr !important;
      text-align: left !important;
      background: #f4f4f5;
      color: #18181b;
      padding: 1.25rem;
      border-radius: 12px;
      overflow-x: auto;
      margin: 1.5rem 0;
      border: 1px solid rgba(0,0,0,0.05);
      font-size: 0.85rem;
    }
    .dark .prose-rtl pre {
      background: #09090b;
      color: #e4e4e7;
      border-color: rgba(255,255,255,0.05);
    }
    
    .prose-rtl code {
      direction: ltr !important;
      text-align: left !important;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(59, 130, 246, 0.1);
      color: #2563eb;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      font-size: 0.9em;
      font-weight: 500;
    }
    .dark .prose-rtl code {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
    }

    /* Callout Styles */
    .callout {
      margin: 1.5rem 0;
      padding: 1rem 1.25rem;
      border-radius: 10px;
      border-right: 4px solid;
      background: rgba(128, 128, 128, 0.05);
    }
    .callout-title {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    .callout-info { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); color: #1d4ed8; }
    .dark .callout-info { color: #93c5fd; background: rgba(59, 130, 246, 0.1); }
    
    .callout-warning { border-color: #f59e0b; background: rgba(245, 158, 11, 0.05); color: #b45309; }
    .dark .callout-warning { color: #fcd34d; background: rgba(245, 158, 11, 0.1); }
    
    .callout-error { border-color: #ef4444; background: rgba(239, 68, 68, 0.05); color: #b91c1c; }
    .dark .callout-error { color: #fca5a5; background: rgba(239, 68, 68, 0.1); }
    
    .callout-success { border-color: #10b981; background: rgba(16, 185, 129, 0.05); color: #047857; }
    .dark .callout-success { color: #6ee7b7; background: rgba(16, 185, 129, 0.1); }

    .prose-rtl ul, .prose-rtl ol {
      margin: 1rem 0;
      padding-right: 1.75rem;
    }
    .prose-rtl li { margin-bottom: 0.5rem; }
  </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 overflow-hidden transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
